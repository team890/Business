<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5efc">
<title>PisoMatch | Datos personales</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #e9ebf5; color: #15152b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .pagina { width: min(100%, 430px); padding: 28px 24px; border-radius: 18px; background: #f9f9fc; box-shadow: 0 18px 48px -28px rgba(30,20,80,.45); }
  .logo { width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 18px; background: linear-gradient(135deg, #6d5efc, #ff5f8f); font-size: 28px; }
  h1 { margin-bottom: 6px; font-size: 27px; line-height: 1.2; }
  h1 span { color: #6d5efc; }
  .intro { margin-bottom: 22px; color: #77778f; font-size: 14px; line-height: 1.5; }
  .campo { margin-bottom: 15px; }
  .campo label, .avatar-titulo { display: block; margin-bottom: 7px; color: #5b5b82; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .campo input { width: 100%; padding: 13px 14px; border: 1px solid #e3e3ef; border-radius: 11px; background: #fff; color: #15152b; font: inherit; font-size: 16px; }
  .campo input:focus { border-color: #6d5efc; outline: 2px solid rgba(109,94,252,.15); }
  .avatares { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 20px; }
  .avatares button { width: 42px; height: 42px; border: 1px solid #e3e3ef; border-radius: 11px; background: #fff; font-size: 22px; cursor: pointer; }
  .avatares button.sel { border-color: #6d5efc; background: #f2f0ff; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; border: 0; }
  .roles legend { grid-column: 1 / -1; margin-bottom: 8px; color: #5b5b82; font-size: 11px; font-weight: 800; text-transform: uppercase; }
  .rol-opcion { display: flex; align-items: center; gap: 9px; padding: 13px 12px; border: 1px solid #e3e3ef; border-radius: 11px; background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
  .rol-opcion:has(input:checked) { border-color: #6d5efc; background: #f2f0ff; }
  .rol-opcion input { width: 18px; height: 18px; accent-color: #6d5efc; }
  .botones-ejemplo { display: grid; gap: 8px; margin: 0 0 16px; }
  .boton-ejemplo { padding: 11px 12px; border: 1px solid #d9d5ff; border-radius: 10px; background: #f2f0ff; color: #5144c5; font-size: 13px; font-weight: 750; cursor: pointer; }
  .continuar { width: 100%; padding: 15px; border: 0; border-radius: 12px; color: #fff; background: linear-gradient(90deg, #6d5efc, #ff5f8f); font-size: 15px; font-weight: 800; cursor: pointer; }
  #mensaje { min-height: 20px; padding-top: 10px; color: #d92d20; font-size: 13px; }
</style>
</head>
<body>
<main class="pagina">
  <div class="logo" aria-hidden="true">🏠</div>
  <h1>Piso<span>Match</span></h1>
  <p class="intro">Para empezar, completa tus datos personales.</p>
  <form id="formRegistro" novalidate>
    <div class="campo">
      <label for="telefono">Teléfono móvil</label>
      <input id="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="+000 123 45 67 89" maxlength="19" required>
    </div>
    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" placeholder="ejemplo@correo.com" maxlength="60" required>
    </div>
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" autocomplete="given-name" placeholder="Ej.: Marta" maxlength="40" required>
    </div>
    <span class="avatar-titulo">Elige tu avatar</span>
    <div class="avatares" id="avatares" aria-label="Avatares">
      <button type="button" data-avatar="🦊" class="sel" aria-label="Zorro">🦊</button>
      <button type="button" data-avatar="🐼" aria-label="Panda">🐼</button>
      <button type="button" data-avatar="🐨" aria-label="Koala">🐨</button>
      <button type="button" data-avatar="🦁" aria-label="León">🦁</button>
      <button type="button" data-avatar="🐯" aria-label="Tigre">🐯</button>
      <button type="button" data-avatar="🐸" aria-label="Rana">🐸</button>
      <button type="button" data-avatar="🐙" aria-label="Pulpo">🐙</button>
      <button type="button" data-avatar="🦄" aria-label="Unicornio">🦄</button>
      <button type="button" data-avatar="🐢" aria-label="Tortuga">🐢</button>
      <button type="button" data-avatar="🦋" aria-label="Mariposa">🦋</button>
    </div>
    <fieldset class="roles">
      <legend>Elige tu perfil</legend>
      <label class="rol-opcion"><input type="radio" name="rol" value="arrendatario" required>Arrendatario</label>
      <label class="rol-opcion"><input type="radio" name="rol" value="inquilino" required>Inquilino</label>
    </fieldset>
    <div class="botones-ejemplo" aria-label="Autocompletar registro con ejemplos">
      <button class="boton-ejemplo" type="button" data-ejemplo-registro="inquilino">Autocompletar ejemplo de inquilino</button>
      <button class="boton-ejemplo" type="button" data-ejemplo-registro="arrendatario">Autocompletar ejemplo de arrendatario</button>
    </div>
    <button class="continuar" type="submit">Continuar</button>
    <div id="mensaje" role="alert"></div>
  </form>
</main>
<script>
(function(){
  'use strict';
  var avatar = '🦊';
  var campos = {
    telefono: document.getElementById('telefono'),
    email: document.getElementById('email'),
    nombre: document.getElementById('nombre')
  };
  function sufijoCorreoValido(email){
    var dominio = email.toLowerCase().split('@').pop();
    var partes = dominio.split('.');
    if (partes.length < 2 || partes.some(function(parte){ return !parte || parte.length > 63 || !/^[a-z0-9-]+$/.test(parte) || parte.charAt(0) === '-' || parte.charAt(parte.length - 1) === '-'; })) return false;
    var sufijo = partes[partes.length - 1];
    var genericos = 'com org net edu gov mil int info biz name pro aero coop museum jobs mobi travel cat asia tel post xxx online site tech store app dev cloud digital email agency company solutions world xyz art blog club live news social website academy education consulting design center services network international'.split(' ');
    var paises = 'ad ae af ag ai al am ao aq ar as at au aw ax az ba bb bd be bf bg bh bi bj bl bm bn bo bq br bs bt bv bw by bz ca cc cd cf cg ch ci ck cl cm cn co cr cu cv cw cx cy cz de dj dk dm do dz ec ee eg eh er es et eu fi fj fk fm fo fr ga gb gd ge gf gg gh gi gl gm gn gp gq gr gs gt gu gw gy hk hm hn hr ht hu id ie il im in io iq ir is it je jm jo jp ke kg kh ki km kn kp kr kw ky kz la lb lc li lk lr ls lt lu lv ly ma mc md me mf mg mh mk ml mm mn mo mp mq mr ms mt mu mv mw mx my mz na nc ne nf ng ni nl no np nr nu nz om pa pe pf pg ph pk pl pm pn pr ps pt pw py qa re ro rs ru rw sa sb sc sd se sg sh si sj sk sl sm sn so sr ss st su sv sx sy sz tc td tf tg th tj tk tl tm tn to tr tt tv tw tz ua ug uk um us uy uz va vc ve vg vi vn vu wf ws ye yt za zm zw'.split(' ');
    return genericos.indexOf(sufijo) !== -1 || paises.indexOf(sufijo) !== -1;
  }
  try {
    var guardado = JSON.parse(sessionStorage.getItem('pm_onboarding_user') || 'null');
    if (guardado){
      campos.telefono.value = guardado.telefono || '';
      campos.email.value = guardado.email || '';
      campos.nombre.value = guardado.nombre || '';
      avatar = guardado.avatar || avatar;
      document.querySelectorAll('[data-avatar]').forEach(function(b){ b.classList.toggle('sel', b.dataset.avatar === avatar); });
      var rolGuardado = document.querySelector('input[name="rol"][value="' + guardado.rol + '"]');
      if (rolGuardado) rolGuardado.checked = true;
    }
  } catch(e){}
  document.getElementById('avatares').addEventListener('click', function(e){
    var button = e.target.closest('[data-avatar]');
    if (!button) return;
    avatar = button.dataset.avatar;
    this.querySelectorAll('[data-avatar]').forEach(function(b){ b.classList.toggle('sel', b === button); });
  });
  document.querySelectorAll('[data-ejemplo-registro]').forEach(function(button){
    button.addEventListener('click', function(){
      var esInquilino = this.dataset.ejemploRegistro === 'inquilino';
      campos.telefono.value = esInquilino ? '+34 600 123 456' : '+34 600 987 654';
      campos.email.value = esInquilino ? 'lucia.ejemplo@example.com' : 'marcos.ejemplo@example.com';
      campos.nombre.value = esInquilino ? 'Lucía Ejemplo' : 'Marcos Ejemplo';
      var rol = document.querySelector('input[name="rol"][value="' + (esInquilino ? 'inquilino' : 'arrendatario') + '"]');
      if (rol) rol.checked = true;
      var avatarButton = document.querySelector('[data-avatar="' + (esInquilino ? '🐼' : '🦊') + '"]');
      if (avatarButton) avatarButton.click();
    });
  });
  document.getElementById('formRegistro').addEventListener('submit', function(e){
    e.preventDefault();
    var mensaje = document.getElementById('mensaje');
    mensaje.textContent = '';
    var telefono = campos.telefono.value.trim();
    var email = campos.email.value.trim();
    var nombre = campos.nombre.value.trim();
    var rol = document.querySelector('input[name="rol"]:checked');
    if (!/^\+\s?\d[\d\s()-]{5,17}$/.test(telefono) || telefono.replace(/\D/g, '').length < 6){ mensaje.textContent = 'Introduce un teléfono válido que empiece por +.'; campos.telefono.focus(); return; }
    if (!campos.email.validity.valid){ mensaje.textContent = 'Introduce un correo electrónico válido.'; campos.email.focus(); return; }
    if (!sufijoCorreoValido(email)){ mensaje.textContent = 'El correo debe terminar en un dominio con sufijo válido, como .com, .es o .edu.'; campos.email.focus(); return; }
    if (!nombre){ mensaje.textContent = 'Introduce tu nombre.'; campos.nombre.focus(); return; }
    if (!rol){ mensaje.textContent = 'Elige Arrendatario o Inquilino para continuar.'; document.querySelector('.roles').scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    var perfil = { telefono: telefono, email: email, nombre: nombre, avatar: avatar, rol: rol.value, desde: Date.now() };
    try {
      sessionStorage.setItem('pm_onboarding_user', JSON.stringify(perfil));
      sessionStorage.removeItem('pm_matches_entry');
    } catch(e){ mensaje.textContent = 'No se pudieron guardar los datos en esta sesión.'; return; }
    window.location.href = rol.value === 'arrendatario' ? 'verificacion-arrendatario.html' : 'verificacion-inquilino.html';
  });
})();
</script>
</body>
</html>
